[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=no
fields=name,generic,comment,categories,filename,keywords
terminal=foot
prompt= "> Search:" 
icon-theme=Tela-circle-dark
layer=top
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=5
exit-on-keyboard-focus-loss=yes

[colors]
background={{colors.background.default.hex}}ff
prompt={{colors.primary.default.hex}}ff
input={{colors.primary.default.hex}}ff
text={{colors.on_surface.default.hex}}ff
match={{colors.primary.default.hex}}ff
selection={{colors.primary.default.hex}}ff
selection-text={{colors.background.default.hex}}ff
border={{colors.primary.default.hex}}ff

[border]
width=4
radius=10

[dmenu]
exit-immediately-if-empty=yes
