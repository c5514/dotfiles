[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=no
fields=name,generic,comment,categories,filename,keywords
terminal=foot
prompt= "> Search:" 
icon-theme=Tela-circle-dark
layer=top
width=40
horizontal-pad=20
vertical-pad=20
inner-pad=5
exit-on-keyboard-focus-loss=yes

[colors]
background=121212ff
prompt=dcd7baff
input=dcd7baff
text=e0e0e0ff
match=76946aff
selection=76946aff
selection-text=1f1f28ff
border=76946aff

[border]
width=4
radius=10

[dmenu]
exit-immediately-if-empty=yes
