# Input (password)
input-field {
    monitor =
    size = 180, 35
    outline_thickness = 2
    dots_size = .15
    dots_spacing = .6
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(cfcfcf)
    font_color = rgb(121212)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    check_color = rgb(204,136,34)
    fail_color = rgb(204,34,34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = #1e1e1e
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    # shadow_color = $background
    shadow_boost = 0.2
}
