# LOCKSCREEN #
# Fonts
$font = Cantarell Regular
$clockFont = Cantarell Black
$minimalFont = Noto Sans Mono

general {
    hide_cursor = false
    ignore_empty_input = true
    text_trim = false
    fractional_scaling = 2
}

auth {
    pam {
        enabled = true
    }

    fingerprint {
        enabled = false
        ready_message = Waiting for Fingerprint
        present_message = Scanning
    }
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/joeyjazz-place-out-of-place.png
    blur_passes = 3
    color = rgb(18,18,18)
}

# Time
label {
    monitor =
    text = $TIME
    color = rgb(239,239,239)
    shadow_passes = 1
    shadow_size = 2
    # shadow_color = $background
    shadow_boost = 0.4
    font_size = 120
    font_family = $clockFont
    position = 0, -60
    halign = center
    valign = top
}

# Date
label {
    monitor = 
    text = cmd[update:43200000] echo -e "$(date +"%A, %d %B %Y")"
    color = rgb(200,200,200)
    shadow_passes = 1
    shadow_size = 2
    shadow_boost = 0.4
    font_size = 20
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
}

# Logged user
label {
    monitor = 
    font_size = 8
    font_family = $minimalFont
    color = rgb(239,239,239)
    text = Currently logged in as $USER
    halign = center
    valign = bottom
    position = 0, 5
}

# Media
label {
    monitor =
    font_size = 12
    font_family = Cantarell
    color = rgb(239,239,239)
    text = cmd[update:1000] bash -c 'playerctl metadata && echo -e "󰎇  $(playerctl metadata title) - $(playerctl metadata artist)"' | tail -n 1
    shadow_passes = 1
    shadow_size = 2
    # shadow_color = $background
    shadow_boost = 0.4
    halign = center
    valign = center
    position = 0, 180
}

